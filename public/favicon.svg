<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.55" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- back card -->
  <g transform="rotate(-14 256 300)">
    <rect x="150" y="150" width="190" height="265" rx="18" fill="#334155" stroke="#64748b" stroke-width="6"/>
  </g>
  <!-- front card -->
  <g transform="rotate(8 256 300)">
    <rect x="170" y="155" width="190" height="265" rx="18" fill="#0f172a" stroke="url(#gold)" stroke-width="10"/>
    <rect x="192" y="182" width="146" height="100" rx="8" fill="#1e293b"/>
    <!-- five-pointed mana star -->
    <path d="M265 196 l13 27 30 4 -22 21 5 30 -26 -14 -26 14 5 -30 -22 -21 30 -4z" fill="url(#gold)"/>
    <rect x="192" y="300" width="146" height="12" rx="6" fill="#475569"/>
    <rect x="192" y="324" width="110" height="12" rx="6" fill="#475569"/>
    <rect x="192" y="348" width="128" height="12" rx="6" fill="#475569"/>
  </g>
  <!-- crown -->
  <path d="M150 140 l30 -62 44 46 32 -66 32 66 44 -46 30 62 z" fill="url(#gold)" stroke="#78350f" stroke-width="4" stroke-linejoin="round"/>
  <rect x="150" y="136" width="212" height="22" rx="6" fill="url(#gold)" stroke="#78350f" stroke-width="4"/>
  <circle cx="180" cy="76" r="10" fill="#fde68a"/>
  <circle cx="256" cy="56" r="11" fill="#fde68a"/>
  <circle cx="332" cy="76" r="10" fill="#fde68a"/>
</svg>
